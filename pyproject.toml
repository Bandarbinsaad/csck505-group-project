[project]
name = "mazebot"
version = "0.1.0"
description = "Behaviour-based maze exploration and map building for a Webots e-puck."
readme = "README.md"
authors = [
    { name = "Alex Senger", email = "alex.senger@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
]

[project.scripts]
render-map = "mazebot.render_map:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
exclude = ["controllers/sensor_smoke_test"]

[tool.ruff.lint]
select = ["E", "F", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"controllers/micromouse/micromouse.py" = ["E402"]
"tests/test_webots_layer.py" = ["E402"]
